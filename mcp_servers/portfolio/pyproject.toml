[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigbid-portfolio-mcp"
version = "0.1.0"
description = "Official Portfolio MCP Server for Freelancers: grounded case study search, skill discovery, and resource templates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Areeba Javed", email = "23i0570@isb.nu.edu.pk" }
]
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.28.0"
]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:app"
